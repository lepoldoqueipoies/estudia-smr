name: One-time SESSION_SECRET setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure-session-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate and store only in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_PROJECT_REF}"
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$session_secret"
          printf "SESSION_SECRET=%s\n" "$session_secret" > "$secret_file"
          supabase secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_REF"
