<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studia · Plataforma de Estudios</title>
  <meta name="description" content="El espacio de tu clase: apuntes, exámenes, calendario, noticias y conversaciones.">
  <meta property="og:title" content="Studia · Plataforma de Estudios">
  <meta property="og:description" content="Apuntes, exámenes, calendario y conversaciones para tu clase.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/neon.css">
</head>
<body>
  <button class="btn theme-toggle" id="themeToggle" aria-label="Cambiar a modo claro" title="Cambiar a modo claro"></button>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <div id="app"></div>
  <div id="toastHost"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
